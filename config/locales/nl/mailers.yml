      hi: "Beste deelnemer,"
      text: "Unfortunately, your proposal %{proposal_link} didn't receive enough votes. It will therefore not be admitted to the next phase of the %{project_link}."
      project_link_text: "Project"
      sincerely: "Hoogachtend"
