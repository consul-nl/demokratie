      subject: "Nieuw evaluatiecommentaar"
      title: Nieuw evaluatiecommentaar voor %{investment}
      hi: Hoi
      new_comment_by: Er is nieuw evaluatiecommentaar van <strong>%{commenter}</strong> op investering %{investment}
      commenter_info: "%{commenter},%{time}:"
