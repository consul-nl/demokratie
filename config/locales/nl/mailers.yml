      notifications: "Would you like to receive email notifications when someone comments on your suggestion? Please check the settings in %{account_link}."
      profile_link_text: "your account"
      sincerely: "Sincerely,"
    budget_investment_unfeasible:
      title: "Your investment project has been marked as unfeasible"
      hi: "Beste deelnemer,"
      new: "Voor al deze vragen nodigen we u uit een <strong>nieuw voorstel</ strong> uit te werken dat zich aanpast aan de voorwaarden van dit proces. U kunt dit doen door deze link te volgen: %{url}."
